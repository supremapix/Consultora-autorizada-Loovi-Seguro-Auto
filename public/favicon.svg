<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="looviGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D2DBF" />
      <stop offset="100%" stop-color="#3F1568" />
    </linearGradient>
  </defs>
  <!-- Background icon shape -->
  <rect width="512" height="512" rx="128" fill="url(#looviGrad)" />
  
  <!-- Loovi 'OO' spectacles emblem -->
  <g fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Circle -->
    <circle cx="180" cy="256" r="64" />
    <!-- Right Circle -->
    <circle cx="332" cy="256" r="64" />
    <!-- Connecting Bridge -->
    <line x1="244" y1="256" x2="268" y2="256" stroke-width="40" />
  </g>
</svg>
